name: Build pmOS begonia (WiFi/Bluetooth, kernel 6.16.4 begonia-conn-wifi) + Plasma Mobile

on:
  workflow_dispatch:
    inputs:
      fde:
        description: Full Disk Encryption
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      extra_space:
        description: Extra space MB
        required: true
        default: "4096"
      cross:
        description: Cross compilation (solo en runner x86_64; en ARM nativo va false)
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      mtk_gen4m:
        description: 'Stack WiFi/BT interno MediaTek (gen4m). OFF = wifi por dongle. ON = wlan0 + BT del propio MT6785'
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    name: Build
    # Runner ARM64 nativo de GHA (gratis para repos publicos). Elegido por
    # dos motivos, ambos verificados en el run 36243494864 (x86_64 + cross):
    #   * Sin emulacion: con runner x86_64, cross=true mete TODO el buildroot
    #     aarch64 detras de qemu-user, y ahi la compilacion de paquetes
    #     aarch64 peta con
    #       cc: fatal error: cannot execute 'cc1': posix_spawnp: ...
    #     al final del "Install Phosh base system" (1 h 40 min de emulacion
    #     paraupa por nada).
    #   * Velocidad: el kernel tardaba 1 h 12 min emulado; nativo son minutos.
    # cross=false es obligatorio aqui (no hay nada que cruzar en aarch64).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    env:
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg

    steps:
      - uses: actions/checkout@v4

      - name: Set up paths
        run: echo "PMAPORTS_DIR=$GITHUB_WORKSPACE/pmaports" >> "$GITHUB_ENV"

      - name: Free disk
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3 python3-pip python3-venv python3-setuptools python3-wheel build-essential bison flex bc cpio zip unzip xz-utils zstd kmod file rsync android-sdk-platform-tools ca-certificates openssl kpartx util-linux parted e2fsprogs dosfstools findutils coreutils
          # qemu-user/binfmt solo hacen falta si se compila cruzado desde x86_64
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get install -y -qq qemu-user-static binfmt-support
          else
            echo "runner $(uname -m): sin qemu, se compila nativo"
          fi

      - name: Clone pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p $HOME/.local/bin
          ln -sf $PWD/pmbootstrap/pmbootstrap.py $HOME/.local/bin/pmbootstrap
          echo $HOME/.local/bin >> $GITHUB_PATH

      - name: Clone pmaports (pinned, no MR 8852)
        run: |
          git config --global user.name "criollojoel10"
          git config --global user.email "98426429+criollojoel10@users.noreply.github.com"
          # Pinned on purpose: el config del kernel es un source sin URL que
          # pmbootstrap copia de este checkout, asi que si upstream lo cambia el
          # sha512sums del APKBUILD deja de cuadrar y el build se rompe sin
          # avisar. Bumpar PMAPORTS_REF es el unico sitio a tocar.
          PMAPORTS_REF="e43b1c9324634a5e28f81ba93b86b030c9cebd6c"
          git init -q "$PMAPORTS_DIR"
          git -C "$PMAPORTS_DIR" remote add origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C "$PMAPORTS_DIR" fetch -q --depth=1 origin "$PMAPORTS_REF"
          # pmbootstrap lee literalmente `git show origin/main:channels.cfg`, asi
          # que un fetch por SHA no basta: deja HEAD detached y sin origin/main
          # y aborta con "Failed to read channels.cfg from 'origin/main'". Hay
          # que crear la ref a mano apuntando al commit fijado.
          git -C "$PMAPORTS_DIR" update-ref refs/remotes/origin/main FETCH_HEAD
          git -C "$PMAPORTS_DIR" checkout -q -B main refs/remotes/origin/main
          git -C "$PMAPORTS_DIR" log -1 --oneline
          git -C "$PMAPORTS_DIR" show origin/main:channels.cfg >/dev/null \
            && echo "channels.cfg legible desde origin/main"

      - name: Apply overlays (kernel APKBUILD, firmware, device) for begonia-conn-wifi
        run: |
          set -euxo pipefail
          OVERLAY_ROOT="$GITHUB_WORKSPACE/.github/overlay/pmaports"
          cp -rv "$OVERLAY_ROOT/device/testing/linux-postmarketos-mediatek-mt6785/APKBUILD" \
            "$PMAPORTS_DIR/device/testing/linux-postmarketos-mediatek-mt6785/APKBUILD"
          # Se copia el CONTENIDO del directorio de cada paquete, no una lista de
          # ficheros. La lista era el bug: cuando se anadio
          # mediatek-wifi.{sh,service} al source= del APKBUILD del dispositivo,
          # esos dos ficheros se quedaron en el repo y nunca llegaron al arbol
          # de pmaports del runner. abuild entonces decia
          #   >>> ERROR: device-xiaomi-begonia: mediatek-wifi.sh is missing in checksums
          # porque el fichero no estaba donde el paquete lo busca. Con esto,
          # cualquier fichero nuevo que se anada al paquete entra solo.
          for pkg in linux-postmarketos-mediatek-mt6785 firmware-xiaomi-begonia \
                     device-xiaomi-begonia; do
            test -d "$OVERLAY_ROOT/device/testing/$pkg"
            test -d "$PMAPORTS_DIR/device/testing/$pkg"
            cp -rv "$OVERLAY_ROOT/device/testing/$pkg/." \
              "$PMAPORTS_DIR/device/testing/$pkg/"
          done
          echo "=== Overlaid kernel APKBUILD (head) ==="
          head -35 "$PMAPORTS_DIR/device/testing/linux-postmarketos-mediatek-mt6785/APKBUILD"

      - name: Recompute sha512sums of the local device files
        run: |
          set -euxo pipefail
          # deviceinfo/kernel-cmdline.conf/modules-initfs son ficheros del
          # propio arbol, pero el sha512sums del APKBUILD de pmaports es el de
          # los suyos. Como este deviceinfo esta modificado (sector 4096 +
          # flash sparse), el hash no cuadra y abuild aborta al compilar el
          # paquete. El run 36307235048 murio aqui con
          #   >>> ERROR: device-xiaomi-begonia: Use 'abuild checksum' ...
          # y solo se ve cuando el paquete se construye de verdad, o sea con
          # pkgrel>=1. Recalcularlo aqui hace que editar deviceinfo no pueda
          # volver a tumbar el build.
          python3 .github/scripts/fix-device-checksums.py "$PMAPORTS_DIR"
          # Comprobacion de que el fichero que se va a compilar ya cuadra. El
          # bloque se extrae entero, sin decir cuantos ficheros hay: el
          # "grep -A5" de antes solo miraba cinco, y con un sexto fichero en
          # source= se comia el final del bloque y pasaba sin comprobar nada.
          cd "$PMAPORTS_DIR/device/testing/device-xiaomi-begonia"
          sed -n '/^sha512sums="/,/^"/p' APKBUILD | sed '1d;$d' | sha512sum -c

      - name: Inspect
        run: |
          mkdir -p artifacts/preflight
          find "$PMAPORTS_DIR/device" -maxdepth 4 -iname "*begonia*" -print | tee artifacts/preflight/begonia-files.txt
          grep -rE "device-xiaomi-begonia|linux-postmarketos-mediatek-mt6785|firmware-xiaomi-begonia" "$PMAPORTS_DIR/device/testing" > artifacts/preflight/grep-begonia.txt 2>&1 || true

      - name: Config (kernel default, Plasma Mobile base)
        run: |
          rm -rf "$PMB_WORK"
          mkdir -p $HOME/.config

          CROSS_INPUT="${{ github.event.inputs.cross }}"
          if [ "$CROSS_INPUT" = "true" ]; then
            CROSS_CFG="True"
          else
            CROSS_CFG="False"
          fi

          # ui = plasma-mobile, no phosh: es el metapackage de pmOS que instala
          # Plasma Mobile como display manager. Con phosh la imagen arrastraba
          # greetd + greetd-phrog y las dos sesiones (phosh y plasma-mobile) en
          # /usr/share/wayland-sessions, asi que greetd lanzaba un selector y no
          # se sabia cual era. Con plasma-mobile no se instala greetd, el preset
          # 90-base.preset habilita plasma-mobile.service y la imagen arranca
          # directa en Plasma. Ver el paso "Verify the display manager" de abajo.
          printf '[pmbootstrap]\naports = %s\nwork = %s\ndevice = xiaomi-begonia\nkernel = stable\nui = plasma-mobile\nuser = joel\nextra_space = %s\nssh_keys = False\nsudo_timer = False\n\n[build_options]\ncross = %s\n' \
            "$PMAPORTS_DIR" "$PMB_WORK" "${{ github.event.inputs.extra_space }}" "$CROSS_CFG" > "$PMB_CONFIG"
          mkdir -p "$PMB_WORK/cache_git"
          echo "8" > "$PMB_WORK/version"
          ln -sfn "$PMAPORTS_DIR" "$PMB_WORK/cache_git/pmaports"
          cat "$PMB_CONFIG"

      - name: Restore cache (apk + distfiles)
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.local/var/pmbootstrap/cache_apk_x86_64
            /home/runner/.local/var/pmbootstrap/cache_apk_aarch64
            /home/runner/.local/var/pmbootstrap/cache_distfiles
          key: begonia-wifi-apk-v1
          restore-keys: begonia-wifi-apk-v1

      - name: Restore cache (ccache)
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.local/var/pmbootstrap/cache_ccache_x86_64
            /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64
          key: begonia-wifi-ccache-v1
          restore-keys: begonia-wifi-ccache-v1

      - name: Fix ownership of the restored ccache dir
        run: |
          set -euxo pipefail
          # pmbootstrap hace `ln -s /mnt/pmbootstrap/ccache /home/pmos/.ccache` y
          # `chown pmos:pmos /mnt/pmbootstrap/ccache` SIN -R, y ese mount point es un
          # bind mount de cache_ccache_aarch64 en el host. Con un cache MISS el dir
          # esta vacio y ccache se crea tmp/ el mismo -> funciona. Con un cache HIT,
          # actions/cache restaura tmp/ y sus ficheros con el uid del runner, el chown
          # no baja al contenido, y ccache revienta al compilar:
          #   ccache: error: failed to create temporary file for
          #   /home/pmos/.ccache/tmp/cpp_stdout.tmp.XXXXXX.s: Permission denied
          # que ademas hace fallar el kernel entero, porque Kconfig.include aborta si
          # as-version.sh no obtiene "GNU assembler" del CC (que aqui es ccache).
          # Por eso arreglamos la propiedad de forma RECURSIVA y sin depender del uid.
          for d in /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64 \
                   /home/runner/.local/var/pmbootstrap/cache_ccache_x86_64; do
            [ -d "$d" ] || sudo mkdir -p "$d"
            sudo chown -R 1000:1000 "$d"
            sudo chmod -R a+rwX "$d"
          done
          ls -ld /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64
          ls -ld /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64/tmp || true

      - name: Patch pmbootstrap (CI fixes)
        run: python3 .github/scripts/patch_pmbootstrap.py

      - name: Enable USB Ethernet & WiFi dongle drivers (+ MTK gen4m opcional)
        env:
          MTK_GEN4M: ${{ inputs.mtk_gen4m }}
        run: |
          # bash -n NO detecta el fallo que se comio el run 36288294044: los
          # backticks dentro de un string con comillas dobles son sintaxis
          # valida, pero bash los ejecuta como command substitution. Un
          # "if RTW88" escrito asi es un error de sintaxis que aborta SOLO el
          # bucle for que lo contiene (los 21 dongles) y el script sigue con
          # exit 0. El .config se queda sin los dongles y el fallo solo
          # aparece 40 minutos despues, en el verify de modulos.
          bash -n .github/scripts/enable_kernel_drivers.sh
          if grep -n '`' .github/scripts/enable_kernel_drivers.sh | grep -v '^[0-9]*:#'; then
            echo "::error::backticks fuera de comentarios: bash los ejecuta como command substitution"
            exit 1
          fi
          bash .github/scripts/enable_kernel_drivers.sh

      - name: Force rebuild kernel (begonia-conn-wifi) with new drivers
        run: |
          KERNEL_PKG="linux-postmarketos-mediatek-mt6785"

          echo "=== Updating checksums after overlay ==="
          pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout checksum "$KERNEL_PKG" 2>&1

          echo "=== Removing cached kernel packages ==="
          find "$PMB_WORK/packages" -name "${KERNEL_PKG}*.apk" -delete 2>/dev/null || true

          echo "=== Building kernel package (force) ==="
          # --lax: pmbootstrap borra y recrea chroot_native y chroot_buildroot* en
          # cada "build" (strict por defecto), y el paso de "checksum" de arriba ya
          # dejo el buildroot con los makedepends instalados. Saltarnos el zap
          # ahorra ~3 min de reconstruccion y hace el build determinista.
          pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 -j 2 --details-to-stdout build --lax "$KERNEL_PKG" --force 2>&1

          echo "=== Newly built kernel packages ==="
          find "$PMB_WORK/packages" -name "${KERNEL_PKG}*.apk" 2>/dev/null

      - name: Install Plasma Mobile base system
        run: |
          set -euxo pipefail

          EXTRA="${{ github.event.inputs.extra_space }}"
          FDE="${{ github.event.inputs.fde }}"
          CROSS="${{ github.event.inputs.cross }}"

          PMB_FLAGS=(
            -c "$PMB_CONFIG"
            -p "$PMAPORTS_DIR"
            -w "$PMB_WORK"
            -E "$EXTRA"
            -t 3600
            -j 2
            --details-to-stdout
          )

          if [ "$CROSS" = "false" ]; then
            PMB_FLAGS+=(--no-cross)
          fi

          echo "=== Pre-build status ==="
          pmbootstrap "${PMB_FLAGS[@]}" status || true

          echo "=== Build chroot ==="
          pmbootstrap "${PMB_FLAGS[@]}" build_init || true

          echo "=== Verify losetup ==="
          pmbootstrap "${PMB_FLAGS[@]}" chroot -- apk add --upgrade losetup util-linux || true
          pmbootstrap "${PMB_FLAGS[@]}" chroot -- sh -c '/usr/sbin/losetup --json --list >/dev/null && echo "losetup OK" || echo "caveat"'

          echo "=== Check disk before swap ==="
          df -h
          echo "=== Create swap (soft-fail) ==="
          FREE_GB=$(df --output=avail / | tail -1 | awk '{print int($1/1024/1024)}')
          if [ "$FREE_GB" -ge 6 ]; then
            sudo fallocate -l 2G /swapfile 2>/dev/null && echo "fallocate OK" || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null && echo "dd OK" || true
            sudo chmod 600 /swapfile 2>/dev/null || true
            sudo mkswap /swapfile 2>/dev/null || true
            sudo swapon /swapfile 2>/dev/null || true
            free -h
            echo "=== Swap created ==="
          else
            echo "Only ${FREE_GB}GB free, skipping swap"
          fi

          echo "=== Start pmbootstrap install (Plasma Mobile) ==="
          if [ "$FDE" = "true" ]; then
            printf '147147\n147147\n' | pmbootstrap "${PMB_FLAGS[@]}" install --fde
          else
            printf '147147\n147147\n' | pmbootstrap "${PMB_FLAGS[@]}" install
          fi

      - name: Verify kernel modules in rootfs (ruta dongle + MTK opcional)
        env:
          MTK_GEN4M: ${{ inputs.mtk_gen4m }}
        run: |
          set -euo pipefail
          CROSS="${{ github.event.inputs.cross }}"
          FLAGS=(-c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout)
          if [ "$CROSS" = "false" ]; then
            FLAGS+=(--no-cross)
          fi

          # El workflow pasa "true"/"false" (input choice), no 1/0. Ambas valen.
          MTK_GEN4M_ON=0
          case "${MTK_GEN4M:-0}" in
            1|true|TRUE|yes) MTK_GEN4M_ON=1 ;;
          esac

          echo "=== Modulos instalados en el rootfs (.ko o .ko.zst) ==="
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- sh -c \
            'find /usr/lib/modules -name "*.ko*" | sort' | tee /tmp/rootfs-mods.txt

          # --- Ruta por dongle (SIEMPRE): lo que tiene que funcionar por defecto ---
          # OJO: los nombres de modulo NO coinciden con los del fichero fuente.
          # Ethernet USB: asix, ax88179_178a, rtl8150 (rtl8150.c, no "r8150"),
          #               r8152, cdc_ether, cdc_eem, cdc_ncm, dm9601, smsc95xx,
          #               sierra_net
          # Wi-Fi USB:    rtl8xxxu (Realtek 8002), rtw88_8812au / rtw88_8821au /
          #               rtw88_8822bu (Realtek 88xx), mt76-usb (CON GUION, no
          #               "mt76_usb"), mt76x0u, mt76x2u, mt7921u
          # BT USB:       btusb (CONFIG_BT_HCIBTUSB)
          # Serial USB:   pl2303, ftdi_sio, cp210x
          # Si falta alguno, el build se da por verde pero el dongle no funcionaria:
          # mejor fallar aqui que descubrirlo con el movil en la mano.
          # El grep es /\.ko(\.comp)?$: con "/foo.ko" a secas tambien pasaria un
          # "foo.ko.bar" cualquiera, y con `grep -q "/foo.ko"` un modulo
          # compilado dentro del kernel (sin .ko) contaria como presente.
          missing=0
          for m in asix ax88179_178a rtl8150 r8152 cdc_ether cdc_eem cdc_ncm \
                   dm9601 smsc95xx sierra_net rtl8xxxu rtw88_8812au rtw88_8821au \
                   rtw88_8822bu mt76-usb mt76x0u mt76x2u mt7921u \
                   btusb pl2303 ftdi_sio cp210x; do
            if grep -qE "/${m}\.ko(\.[a-z0-9]+)?$" /tmp/rootfs-mods.txt; then
              echo "OK dongle ${m}.ko"
            else
              echo "::error::el rootfs no trae ${m}.ko (ruta por dongle)"
              missing=1
            fi
          done

          # --- Stack MTK interno (opt-in con mtk_gen4m=true) ---
          # Los tres modulos del forward-port (drivers/misc/mediatek/{connectivity,btif}).
          if [ "$MTK_GEN4M_ON" != "1" ]; then
            echo "mtk_gen4m=false: no se exige el stack interno (wifi por dongle)"
          else
            for m in wmt_drv wlan_gen4m mtk-vendor-btif; do
              if grep -qE "/${m}\.ko(\.[a-z0-9]+)?$" /tmp/rootfs-mods.txt; then
                echo "OK mtk ${m}.ko"
              else
                echo "::error::el kernel no trae ${m}.ko (mtk_gen4m=true)"
                missing=1
              fi
            done
          fi
          exit "$missing"

      - name: Verify touch firmware (panel Tianma bajo el nombre CSOT)
        run: |
          set -euo pipefail
          CROSS="${{ github.event.inputs.cross }}"
          FLAGS=(-c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout)
          if [ "$CROSS" = "false" ]; then
            FLAGS+=(--no-cross)
          fi
          # El DTB 6.16 pide "novatek/nt36672a_begonia_csot.bin" y el driver del
          # tactil lo carga tal cual. En una unidad Tianma ese nombre tiene que
          # contener el binario Tianma, o el panel enciende y el touch sale con
          # los ejes cruzados sin decir nada en el log. Un simple "existe el
          # fichero" no lo detecta: los dos nombres existen siempre.
          #   tianma 53321 B md5 7d67c2e9167f1a630576c177c1b831f7
          #   csot   53731 B md5 52f5e96f84fbdd6cbed2e98790a202df
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- sh -c '
            set -e
            D=/lib/firmware/novatek
            ls -l $D
            md5sum $D/nt36672a_begonia_csot.bin.zst $D/nt36672a_begonia_tianma.bin.zst
            test -s $D/nt36672a_begonia_tianma.bin.zst || { echo "FALTA el binario Tianma"; exit 1; }
            test "$(md5sum $D/nt36672a_begonia_csot.bin.zst | cut -d" " -f1)" = 7d67c2e9167f1a630576c177c1b831f7 || {
              echo "FALLO: el nombre CSOT no contiene el binario Tianma (touch invertido)"; exit 1; }
            echo "OK: el nombre CSOT contiene el binario Tianma"
          '

      # Guarda contra la trampa de apk mas cara de este workflow: si la version
      # local de un APKBUILD sobrepuesto coincide con la publicada en el repo,
      # apk USA la del repo y no construye la nuestra. Con eso, la dependencia
      # firmware-xiaomi-begonia-connectivity se pierde en silencio (el paquete
      # connectivity si se construye, simplemente no se instala) y la imagen
      # sale verde, arranca y no tiene ni un blob de MediaTek, que es
      # exactamente lo que necesita wlan_gen4m para pedir su firmware.
      - name: Verify MediaTek connectivity firmware in the rootfs
        run: |
          set -euo pipefail
          CROSS="${{ github.event.inputs.cross }}"
          FLAGS=(-c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout)
          if [ "$CROSS" = "false" ]; then
            FLAGS+=(--no-cross)
          fi
          # 1) el subpaquete esta registrado como instalado, no solo construido
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- sh -c '
            grep -q "^P:firmware-xiaomi-begonia-connectivity$" /lib/apk/db/installed || {
              echo "::error::firmware-xiaomi-begonia-connectivity NO esta instalado (apk uso el paquete del repo)"; exit 1; }
            echo "OK: firmware-xiaomi-begonia-connectivity instalado"
          '
          # 2) y device-xiaomi-begonia lo declara en sus depends (si no, el 1 es casualidad)
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- sh -c '
            grep -q "^D:.*firmware-xiaomi-begonia-connectivity" /lib/apk/db/installed || {
              echo "::error::device-xiaomi-begonia no depende de firmware-xiaomi-begonia-connectivity (se instalo la version del repo, sube pkgrel)"; exit 1; }
            echo "OK: device-xiaomi-begonia depende del subpaquete connectivity"
          '
          # 3) los 7 blobs, con tamano no nulo, en la RAIZ de /lib/firmware/.
          #    OJO: el fwport de minorum llama a request_firmware() con nombres
          #    pelados, sin carpeta (wmt_conf.h:34, wmt_dev.c:406/459/508,
          #    wmt_ctrl.c:654-656, config.h:149). El kernel solo los busca en
          #    /lib/firmware/ y /usr/lib/firmware/ en la raiz, asi que en los
          #    builds 36304158010 y 36309275971, que los ponian en
          #    /lib/firmware/mediatek/, modprobe wmt_drv moria con
          #    "Direct firmware load for WMT_SOC.cfg failed with error -2" y
          #    wlan0 no aparecia nunca. Este check es lo que lo detecta.
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- sh -c '
            set -e
            D=/lib/firmware
            ls -l $D/WMT_SOC.cfg.zst $D/WIFI_RAM_CODE_soc1_0_2a_1.bin.zst
            for f in WIFI_RAM_CODE_soc1_0_2a_1.bin.zst WMT_SOC.cfg.zst \
                     soc1_0_patch_mcu_2a_1_hdr.bin.zst soc1_0_ram_bt_2a_1_hdr.bin.zst \
                     soc1_0_ram_mcu_2a_1_hdr.bin.zst soc1_0_ram_wifi_2a_1_hdr.bin.zst \
                     wifi.cfg.zst; do
              test -s "$D/$f" || { echo "::error::falta o vacio $D/$f (el wifi interno no cargara firmware)"; exit 1; }
            done
            # y que no esten solo en un subdirectorio, que es el bug que se
            # acaba de arreglar: si aparecen en $D/mediatek/ y no en la raiz,
            # el driver no los encuentra.
            for f in WIFI_RAM_CODE_soc1_0_2a_1.bin.zst WMT_SOC.cfg.zst; do
              if [ -e "$D/mediatek/$f" ] && [ ! -e "$D/$f" ]; then
                echo "::error::$f esta en firmware/mediatek/ y no en la raiz: request_firmware() no lo encontrara"; exit 1
              fi
            done
            # y que el kernel sepa descomprimir los .zst solos
            if [ -r /proc/config.gz ]; then
              zcat /proc/config.gz | grep -q "FW_LOADER_COMPRESS_ZSTD=y" \
                || { echo "::error::CONFIG_FW_LOADER_COMPRESS_ZSTD no esta activo"; exit 1; }
              echo "OK: el kernel descomprime los .zst"
            else
              echo "AVISO: sin /proc/config.gz, no se puede comprobar FW_LOADER_COMPRESS_ZSTD"
            fi
            echo "OK: los 7 blobs de mediatek estan en la raiz de /lib/firmware/"
          '

      # El wifi no arranca solo en un port de pmOS: hay que cargar los tres
      # modulos del fwport y escribir un 1 en /dev/wmtWifi. Sin este servicio el
      # movil arranca sin wlan0 y el usuario tiene que hacerlo a mano (que es
      # como se verifico que el driver funciona, antes de automatizarlo).
      - name: Verify the wifi autostart service
        run: |
          set -euo pipefail
          CROSS="${{ github.event.inputs.cross }}"
          FLAGS=(-c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout)
          if [ "$CROSS" = "false" ]; then
            FLAGS+=(--no-cross)
          fi
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- sh -c '
            set -e
            U=/usr/lib/systemd/system/mediatek-wifi.service
            S=/usr/libexec/mediatek-wifi.sh
            W=/usr/lib/systemd/system/multi-user.target.wants/mediatek-wifi.service

            test -f "$U" || { echo "::error::falta $U"; exit 1; }
            test -x "$S" || { echo "::error::$S no es ejecutable"; exit 1; }

            # -L y no -e: un symlink roto tambien "existe" para -e si el destino
            # es relativo, y aqui el destino es absoluto. Comprobar el destino
            # es lo que de verdad importa.
            test -L "$W" || { echo "::error::$W no es un symlink: el servicio no arrancara en el boot"; exit 1; }
            T=$(readlink "$W")
            echo "symlink: $W -> $T"
            case "$T" in
              /usr/lib/systemd/system/mediatek-wifi.service) ;;
              *) echo "::error::el symlink apunta a $T, no a la ruta esperada"; exit 1 ;;
            esac
            test -e "$W" || { echo "::error::el symlink esta roto ($T no existe)"; exit 1; }

            # y que el ExecStart apunte al script de verdad, no a una ruta
            # inventada: un ExecStart a un fichero inexistente hace que el
            # servicio falle en cada arranque sin que se note.
            grep -q "^ExecStart=$S$" "$U" \
              || { echo "::error::ExecStart no es $S"; grep ^ExecStart= "$U"; exit 1; }

            # y que el script sea lo que creemos: modprobe de los tres modulos
            # y el write a /dev/wmtWifi, que es el interruptor del conn-MCU.
            for m in mtk-vendor-btif wmt_drv wlan_gen4m; do
              grep -q "modprobe $m" "$S" \
                || { echo "::error::el script no hace modprobe $m"; exit 1; }
            done
            grep -q "> /dev/wmtWifi" "$S" \
              || { echo "::error::el script no escribe en /dev/wmtWifi: el chip no encendera"; exit 1; }
            # sin shebang, systemd lo ejecuta con /bin/sh y falla
            head -c 2 "$S" | grep -q "#!" || { echo "::error::el script no tiene shebang"; exit 1; }

            # los tres modulos tienen que existir en la imagen, o el modprobe
            # del servicio falla en el primer arranque
            for m in mtk-vendor-btif wmt_drv wlan_gen4m; do
              modinfo "$m" >/dev/null 2>&1 \
                || { echo "::error::el modulo $m no esta en la imagen"; exit 1; }
            done

            echo "OK: el servicio de arranque del wifi esta instalado y bien cableado"
          '

      - name: Enforce Plasma Mobile as the only display manager
        run: |
          set -euxo pipefail

          CROSS="${{ github.event.inputs.cross }}"
          FLAGS=(-c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout)
          if [ "$CROSS" = "false" ]; then
            FLAGS+=(--no-cross)
          fi

          CH() { pmbootstrap "${FLAGS[@]}" chroot --rootfs -- "$@"; }

          # Con ui = plasma-mobile el metapackage correcto ya viene del
          # `pmbootstrap install` de arriba. Este paso no anade nada: deja el
          # estado como debe estar y falla si algo quedo de phosh.
          echo "=== Paquetes de interfaz instalados ==="
          CH sh -c 'apk info 2>/dev/null | grep -iE "^(phosh|postmarketos-ui|greetd|plasmalogin)" | sort'

          echo "=== Plasma Mobile presente ==="
          CH sh -c 'apk info -e postmarketos-ui-plasma-mobile >/dev/null && echo "OK: postmarketos-ui-plasma-mobile instalado"'

          # greetd viene de greetd-phrog, que solo lo arrastra postmarketos-ui-phosh.
          # Si esta aun aqui, es que la imagen volveria al selector de sesion.
          echo "=== phosh y greetd NO deben estar ==="
          if CH sh -c 'apk info 2>/dev/null | grep -qE "^(phosh|greetd|postmarketos-ui-phosh)"'; then
            echo "::error::La imagen arrastra phosh o greetd; el arranque dejaria de ser Plasma Mobile directo"
            exit 1
          fi
          echo "OK: ni phosh ni greetd"

          echo "=== /etc/default_user (usuario de plasma-mobile.service) ==="
          # El generador system-generators-plasma-mobile-user-override lee este
          # fichero y hace un drop-in con User=/Group=. Si no existe, cae a
          # 10000, que es el uid que pmbootstrap da al usuario (adduser -u 10000),
          # asi que hoy funciona por coincidencia. Escribirlo evita depender de
          # esa coincidencia: el unit trae User=1000, que NO es el usuario.
          CH sh -c 'u=$(awk -F: "\$3==10000{print \$1}" /etc/passwd); echo "usuario con uid 10000: \$u"; printf "%s\n" "\$u" > /etc/default_user; cat /etc/default_user'
          CH sh -c 'test -s /etc/default_user || { echo "FALLO: /etc/default_user vacio"; exit 1; }'

          echo "=== Habilitar plasma-mobile.service como display manager ==="
          # El unit de plasma-mobile trae en [Install] SOLO "Alias=display-manager.service",
          # sin WantedBy=. Consecuencias, comprobadas en el movil:
          #  - "systemctl enable plasma-mobile.service" crea unicamente el alias, y
          #    falla con "File ... already exists and is a symlink to greetd" si
          #    quedo el de greetd de una imagen anterior.
          #  - El alias por si solo no mete la unidad en ningun target, asi que no
          #    basta para que arranque al boot.
          # Por eso: symlink viejo fuera, enable para el alias, y el wants symlink
          # explicito. El preset 90-base.preset dice "enable plasma-mobile.service",
          # pero un preset solo se aplica al instalar el paquete.
          CH sh -c 'rm -f /etc/systemd/system/display-manager.service'
          CH systemctl enable plasma-mobile.service
          CH sh -c 'ln -sf /usr/lib/systemd/system/plasma-mobile.service /etc/systemd/system/multi-user.target.wants/plasma-mobile.service'
          CH sh -c 'test "$(systemctl is-enabled plasma-mobile.service)" = enabled || { echo "FALLO: plasma-mobile.service no queda enabled"; exit 1; }'
          CH sh -c 'echo "display-manager.service -> $(readlink /etc/systemd/system/display-manager.service)"'
          CH sh -c 'echo "multi-user.target.wants  -> $(readlink /etc/systemd/system/multi-user.target.wants/plasma-mobile.service)"'

          echo "=== Sesiones de Wayland disponibles ==="
          CH sh -c 'ls -1 /usr/share/wayland-sessions/ 2>/dev/null || echo "(ninguna)"'

          echo "=== Reconstruir la imagen con el estado de la UI ==="
          pmbootstrap "${FLAGS[@]}" -E "${{ github.event.inputs.extra_space }}" -j 2 install --password 147147 2>&1

      - name: Verify the display manager is Plasma Mobile
        run: |
          set -euo pipefail
          CROSS="${{ github.event.inputs.cross }}"
          FLAGS=(-c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout)
          if [ "$CROSS" = "false" ]; then
            FLAGS+=(--no-cross)
          fi
          # Con ui=phosh el arranque NO era Plasma Mobile: greetd ofrecia un
          # selector con las sesiones de /usr/share/wayland-sessions (phosh,
          # plasma-mobile, plasma) y habia que elegir a mano. Con
          # ui=plasma-mobile no se instala greetd y el alias display-manager
          # tiene que apuntar a plasma-mobile. Este check falla si eso regressa.
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- sh -c '
            set -e
            echo "=== metapackages de interfaz instalados ==="
            apk info 2>/dev/null | grep -E "^(postmarketos-ui-)" | sort

            echo "=== Plasma Mobile presente ==="
            apk info -e postmarketos-ui-plasma-mobile >/dev/null \
              || { echo "FALLO: la imagen no lleva postmarketos-ui-plasma-mobile"; exit 1; }
            echo "OK: postmarketos-ui-plasma-mobile instalado"

            echo "=== phosh y greetd NO deben estar ==="
            if apk info 2>/dev/null | grep -qE "^(phosh|greetd|postmarketos-ui-phosh)"; then
              echo "FALLO: la imagen arrastra phosh o greetd; el arranque dejaria de ser Plasma Mobile directo"
              apk info 2>/dev/null | grep -E "^(phosh|greetd|postmarketos-ui-phosh)" | sort
              exit 1
            fi
            echo "OK: ni phosh ni greetd"

            echo "=== display-manager.service apunta a plasma-mobile ==="
            DM=/etc/systemd/system/display-manager.service
            if [ ! -L "$DM" ]; then
              echo "FALLO: no hay symlink en $DM"
              exit 1
            fi
            T=$(readlink "$DM")
            echo "display-manager.service -> $T"
            test "$T" = /usr/lib/systemd/system/plasma-mobile.service || {
              echo "FALLO: display-manager.service deberia apuntar a plasma-mobile.service, no a $T"
              exit 1
            }

            echo "=== plasma-mobile.service arranca al boot ==="
            # El unit solo trae Alias= en [Install], sin WantedBy=, asi que el
            # alias no mete la unidad en ningun target. Sin este wants symlink la
            # imagen arrives a un prompt de login en vez de a Plasma Mobile.
            W=/etc/systemd/system/multi-user.target.wants/plasma-mobile.service
            if [ ! -L "$W" ]; then
              echo "FALLO: falta $W; plasma-mobile.service no arrancaria al boot"
              exit 1
            fi
            echo "multi-user.target.wants -> $(readlink "$W")"
            test "$(systemctl is-enabled plasma-mobile.service)" = enabled || {
              echo "FALLO: is-enabled de plasma-mobile.service no es enabled"
              exit 1
            }

            echo "=== /etc/default_user (usuario del servicio) ==="
            # Lo lee system-generators-plasma-mobile-user-override para el drop-in
            # User=/Group=. Sin el fichero cae a 10000, que hoy coincide con el
            # uid que pmbootstrap da, pero el unit trae User=1000.
            test -s /etc/default_user || {
              echo "FALLO: /etc/default_user vacio o ausente; el servicio correria como el uid equivocado (1000)"
              exit 1
            }
            echo "/etc/default_user = $(cat /etc/default_user)"

            echo "=== la sesion de Plasma Mobile esta disponible ==="
            ls -1 /usr/share/wayland-sessions/
            test -f /usr/share/wayland-sessions/plasma-mobile.desktop \
              || { echo "FALLO: falta plasma-mobile.desktop en wayland-sessions"; exit 1; }
            if [ -f /usr/share/wayland-sessions/phosh.desktop ]; then
              echo "FALLO: quedo phosh.desktop; el movil podria arrancar en phosh"
              exit 1
            fi
            echo "OK: Plasma Mobile es el unico display manager de la imagen"
          '
      - name: Export (primary)
        if: always()
        run: |
          mkdir -p artifacts/export
          pmbootstrap -c $PMB_CONFIG -p $PMAPORTS_DIR -w $PMB_WORK -t 3600 --details-to-stdout export || true
          cp -av /tmp/postmarketOS-export/* artifacts/export/ 2>/dev/null || true

      - name: Salvage images
        if: always()
        run: |
          set +e
          mkdir -p artifacts/salvage
          find "$PMB_WORK" -name "*.img" -exec cp -av {} artifacts/salvage/ \; 2>/dev/null
          find "$PMB_WORK" -name "boot.img" -exec cp -av {} artifacts/salvage/ \; 2>/dev/null
          find "$PMB_WORK" -name "initramfs*" -exec cp -av {} artifacts/salvage/ \; 2>/dev/null
          find "$PMB_WORK" -name "vmlinuz*" -exec cp -av {} artifacts/salvage/ \; 2>/dev/null
          find artifacts/salvage -type f -printf "%p %s bytes\n" | sort > artifacts/salvage/salvaged-files.txt 2>/dev/null
          set -e

      - name: Consolidate images
        if: always()
        run: |
          set +e
          mkdir -p artifacts/images
          cp -av artifacts/export/* artifacts/images/ 2>/dev/null
          cp -av artifacts/salvage/* artifacts/images/ 2>/dev/null
          find artifacts/images -type f -printf "%p %s bytes\n" | sort | tee artifacts/images/files.txt
          set -e

      - name: Validate
        if: always()
        run: |
          CNT=$(find artifacts -name "*.img" 2>/dev/null | wc -l)
          echo "image-files=$CNT"
          if [ "$CNT" -lt 1 ]; then
            echo "ERROR: No images found anywhere"
            find artifacts -type f -name "*.txt" -exec cat {} \; 2>/dev/null || true
            exit 1
          fi
          echo "SUCCESS: $CNT image file(s) found"
          find artifacts -type f -name "*.img" -o -name "boot*" -o -name "initramfs*" -o -name "vmlinuz*" 2>/dev/null | sort

      # El initramfs es lo que arranca de verdad: el tactil se carga desde ahi
      # (modulos-initfs) y el firmware tambien. Un rootfs correcto no dice nada
      # si el initramfs se construyo con el binario del otro panel.
      - name: Verify initramfs (modulos de panel/tactil + firmware Tianma)
        if: always()
        run: |
          set +e
          IR=$(ls -S "$GITHUB_WORKSPACE"/artifacts/images/initramfs* 2>/dev/null | head -1)
          if [ -z "$IR" ]; then
            echo "::warning::no hay initramfs en el artifact, no se puede verificar"
            exit 0
          fi
          echo "initramfs: $IR ($(stat -c%s "$IR") bytes)"
          rm -rf /tmp/ir && mkdir -p /tmp/ir && cd /tmp/ir
          # OJO: el initramfs de pmOS es un cpio comprimido y `file` no esta instalado
          # en el runner, asi que el formato se decide por los bytes magicos. Y la
          # ruta tiene que ser ABSOLUTA: antes se hacia `cd /tmp/ir` y luego se
          # usaba la ruta relativa, con lo que la redireccion de cpio fallaba en
          # silencio y el check::*error::*:: acusaba 8 modulos que si estaban.
          magic=$(head -c4 "$IR" | od -An -tx1 | tr -d ' \n')
          case "$magic" in
            1f8b*)      echo "formato: gzip"; zcat "$IR" | cpio -idm 2>/tmp/ir.err ;;
            28b52ffd*)  echo "formato: zstd"; zstd -dc "$IR" | cpio -idm 2>/tmp/ir.err ;;
            30373037*)  echo "formato: cpio(newc)"; cpio -idm 2>/tmp/ir.err < "$IR" ;;
            *)          echo "::error::formato de initramfs desconocido (magic=$magic)"; exit 1 ;;
          esac
          n=$(find /tmp/ir -type f | wc -l)
          echo "ficheros extraidos: $n"
          if [ "$n" -lt 10 ]; then
            echo "::error::el initramfs no se ha podido descomprimir"
            sed -n '1,5p' /tmp/ir.err | sed 's/^/    /'
            exit 1
          fi
          cd /tmp/ir
          missing=0
          for m in novatek-nvt-ts-core novatek-nvt-ts-spi panel-novatek-nt36672a \
                   ti-lmu leds-ti-lmu-common lm363x-regulator lm36274_bl; do
            if find . -name "${m}.ko*" | grep -q .; then
              echo "OK initramfs ${m}"
            else
              echo "::error::falta ${m}.ko en el initramfs (la pantalla no tocara)"
              missing=1
            fi
          done
          CSOT=$(find . -name "nt36672a_begonia_csot.bin.zst" | head -1)
          if [ -z "$CSOT" ]; then
            echo "::error::no hay firmware del tactil en el initramfs"
            missing=1
          else
            got=$(md5sum "$CSOT" | cut -d' ' -f1)
            echo "firmware csot en el initramfs: $got"
            if [ "$got" != "7d67c2e9167f1a630576c177c1b831f7" ]; then
              echo "::error::el initramfs lleva el binario CSOT: el tactil saldra invertido"
              missing=1
            else
              echo "OK: el initramfs lleva el binario Tianma bajo el nombre CSOT"
            fi
          fi
          exit "$missing"

      - name: Checksums
        if: always()
        run: |
          find artifacts -type f -not -name SHA256SUMS.txt -print0 | xargs -0 sha256sum > artifacts/SHA256SUMS.txt 2>/dev/null || true

      - name: Debug logs
        if: always()
        run: |
          mkdir -p artifacts/logs
          cp -av $PMB_CONFIG artifacts/logs/ 2>/dev/null || true
          cp -av $PMB_WORK/log.txt artifacts/logs/pmbootstrap-log.txt 2>/dev/null || true
          pmbootstrap -c $PMB_CONFIG -p $PMAPORTS_DIR -w $PMB_WORK status > artifacts/logs/pmbootstrap-status.txt 2>&1 || true
          df -h > artifacts/logs/df-h.txt 2>&1 || true

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmos-begonia-wifi-6.16.4-cross-${{ github.event.inputs.cross }}
          path: artifacts/
          retention-days: 14