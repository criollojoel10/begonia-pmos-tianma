name: Build pmOS begonia (WiFi/Bluetooth, kernel 6.16.4 begonia-conn-wifi) + Plasma Mobile

on:
  workflow_dispatch:
    inputs:
      fde:
        description: Full Disk Encryption
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      extra_space:
        description: Extra space MB
        required: true
        default: "4096"
      cross:
        description: Cross compilation (solo en runner x86_64; en ARM nativo va false)
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      mtk_gen4m:
        description: 'Stack WiFi/BT interno MediaTek (gen4m). OFF = wifi por dongle. ON = wlan0 + BT del propio MT6785'
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    name: Build
    # Runner ARM64 nativo de GHA (gratis para repos publicos). Elegido por
    # dos motivos, ambos verificados en el run 36243494864 (x86_64 + cross):
    #   * Sin emulacion: con runner x86_64, cross=true mete TODO el buildroot
    #     aarch64 detras de qemu-user, y ahi la compilacion de paquetes
    #     aarch64 peta con
    #       cc: fatal error: cannot execute 'cc1': posix_spawnp: ...
    #     al final del "Install Phosh base system" (1 h 40 min de emulacion
    #     paraupa por nada).
    #   * Velocidad: el kernel tardaba 1 h 12 min emulado; nativo son minutos.
    # cross=false es obligatorio aqui (no hay nada que cruzar en aarch64).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    env:
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg

    steps:
      - uses: actions/checkout@v4

      - name: Set up paths
        run: echo "PMAPORTS_DIR=$GITHUB_WORKSPACE/pmaports" >> "$GITHUB_ENV"

      - name: Free disk
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3 python3-pip python3-venv python3-setuptools python3-wheel build-essential bison flex bc cpio zip unzip xz-utils zstd kmod file rsync android-sdk-platform-tools ca-certificates openssl kpartx util-linux parted e2fsprogs dosfstools findutils coreutils
          # qemu-user/binfmt solo hacen falta si se compila cruzado desde x86_64
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get install -y -qq qemu-user-static binfmt-support
          else
            echo "runner $(uname -m): sin qemu, se compila nativo"
          fi

      - name: Clone pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p $HOME/.local/bin
          ln -sf $PWD/pmbootstrap/pmbootstrap.py $HOME/.local/bin/pmbootstrap
          echo $HOME/.local/bin >> $GITHUB_PATH

      - name: Clone pmaports (pinned, no MR 8852)
        run: |
          git config --global user.name "criollojoel10"
          git config --global user.email "98426429+criollojoel10@users.noreply.github.com"
          # Pinned on purpose: el config del kernel es un source sin URL que
          # pmbootstrap copia de este checkout, asi que si upstream lo cambia el
          # sha512sums del APKBUILD deja de cuadrar y el build se rompe sin
          # avisar. Bumpar PMAPORTS_REF es el unico sitio a tocar.
          PMAPORTS_REF="e43b1c9324634a5e28f81ba93b86b030c9cebd6c"
          git init -q "$PMAPORTS_DIR"
          git -C "$PMAPORTS_DIR" remote add origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C "$PMAPORTS_DIR" fetch -q --depth=1 origin "$PMAPORTS_REF"
          # pmbootstrap lee literalmente `git show origin/main:channels.cfg`, asi
          # que un fetch por SHA no basta: deja HEAD detached y sin origin/main
          # y aborta con "Failed to read channels.cfg from 'origin/main'". Hay
          # que crear la ref a mano apuntando al commit fijado.
          git -C "$PMAPORTS_DIR" update-ref refs/remotes/origin/main FETCH_HEAD
          git -C "$PMAPORTS_DIR" checkout -q -B main refs/remotes/origin/main
          git -C "$PMAPORTS_DIR" log -1 --oneline
          git -C "$PMAPORTS_DIR" show origin/main:channels.cfg >/dev/null \
            && echo "channels.cfg legible desde origin/main"

      - name: Apply overlays (kernel APKBUILD, firmware, device) for begonia-conn-wifi
        run: |
          set -euxo pipefail
          OVERLAY_ROOT="$GITHUB_WORKSPACE/.github/overlay/pmaports"
          cp -rv "$OVERLAY_ROOT/device/testing/linux-postmarketos-mediatek-mt6785/APKBUILD" \
            "$PMAPORTS_DIR/device/testing/linux-postmarketos-mediatek-mt6785/APKBUILD"
          cp -rv "$OVERLAY_ROOT/device/testing/firmware-xiaomi-begonia/APKBUILD" \
            "$PMAPORTS_DIR/device/testing/firmware-xiaomi-begonia/APKBUILD"
          cp -rv "$OVERLAY_ROOT/device/testing/device-xiaomi-begonia/APKBUILD" \
            "$OVERLAY_ROOT/device/testing/device-xiaomi-begonia/deviceinfo" \
            "$OVERLAY_ROOT/device/testing/device-xiaomi-begonia/kernel-cmdline.conf" \
            "$OVERLAY_ROOT/device/testing/device-xiaomi-begonia/modules-initfs" \
            "$PMAPORTS_DIR/device/testing/device-xiaomi-begonia/"
          echo "=== Overlaid kernel APKBUILD (head) ==="
          head -35 "$PMAPORTS_DIR/device/testing/linux-postmarketos-mediatek-mt6785/APKBUILD"

      - name: Inspect
        run: |
          mkdir -p artifacts/preflight
          find "$PMAPORTS_DIR/device" -maxdepth 4 -iname "*begonia*" -print | tee artifacts/preflight/begonia-files.txt
          grep -rE "device-xiaomi-begonia|linux-postmarketos-mediatek-mt6785|firmware-xiaomi-begonia" "$PMAPORTS_DIR/device/testing" > artifacts/preflight/grep-begonia.txt 2>&1 || true

      - name: Config (kernel default, Phosh base)
        run: |
          rm -rf "$PMB_WORK"
          mkdir -p $HOME/.config

          CROSS_INPUT="${{ github.event.inputs.cross }}"
          if [ "$CROSS_INPUT" = "true" ]; then
            CROSS_CFG="True"
          else
            CROSS_CFG="False"
          fi

          printf '[pmbootstrap]\naports = %s\nwork = %s\ndevice = xiaomi-begonia\nkernel = stable\nui = phosh\nuser = joel\nextra_space = %s\nssh_keys = False\nsudo_timer = False\n\n[build_options]\ncross = %s\n' \
            "$PMAPORTS_DIR" "$PMB_WORK" "${{ github.event.inputs.extra_space }}" "$CROSS_CFG" > "$PMB_CONFIG"
          mkdir -p "$PMB_WORK/cache_git"
          echo "8" > "$PMB_WORK/version"
          ln -sfn "$PMAPORTS_DIR" "$PMB_WORK/cache_git/pmaports"
          cat "$PMB_CONFIG"

      - name: Restore cache (apk + distfiles)
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.local/var/pmbootstrap/cache_apk_x86_64
            /home/runner/.local/var/pmbootstrap/cache_apk_aarch64
            /home/runner/.local/var/pmbootstrap/cache_distfiles
          key: begonia-wifi-apk-v1
          restore-keys: begonia-wifi-apk-v1

      - name: Restore cache (ccache)
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.local/var/pmbootstrap/cache_ccache_x86_64
            /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64
          key: begonia-wifi-ccache-v1
          restore-keys: begonia-wifi-ccache-v1

      - name: Fix ownership of the restored ccache dir
        run: |
          set -euxo pipefail
          # pmbootstrap hace `ln -s /mnt/pmbootstrap/ccache /home/pmos/.ccache` y
          # `chown pmos:pmos /mnt/pmbootstrap/ccache` SIN -R, y ese mount point es un
          # bind mount de cache_ccache_aarch64 en el host. Con un cache MISS el dir
          # esta vacio y ccache se crea tmp/ el mismo -> funciona. Con un cache HIT,
          # actions/cache restaura tmp/ y sus ficheros con el uid del runner, el chown
          # no baja al contenido, y ccache revienta al compilar:
          #   ccache: error: failed to create temporary file for
          #   /home/pmos/.ccache/tmp/cpp_stdout.tmp.XXXXXX.s: Permission denied
          # que ademas hace fallar el kernel entero, porque Kconfig.include aborta si
          # as-version.sh no obtiene "GNU assembler" del CC (que aqui es ccache).
          # Por eso arreglamos la propiedad de forma RECURSIVA y sin depender del uid.
          for d in /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64 \
                   /home/runner/.local/var/pmbootstrap/cache_ccache_x86_64; do
            [ -d "$d" ] || sudo mkdir -p "$d"
            sudo chown -R 1000:1000 "$d"
            sudo chmod -R a+rwX "$d"
          done
          ls -ld /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64
          ls -ld /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64/tmp || true

      - name: Patch pmbootstrap (CI fixes)
        run: python3 .github/scripts/patch_pmbootstrap.py

      - name: Enable USB Ethernet & WiFi dongle drivers (+ MTK gen4m opcional)
        env:
          MTK_GEN4M: ${{ inputs.mtk_gen4m }}
        run: bash .github/scripts/enable_kernel_drivers.sh

      - name: Force rebuild kernel (begonia-conn-wifi) with new drivers
        run: |
          KERNEL_PKG="linux-postmarketos-mediatek-mt6785"

          echo "=== Updating checksums after overlay ==="
          pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout checksum "$KERNEL_PKG" 2>&1

          echo "=== Removing cached kernel packages ==="
          find "$PMB_WORK/packages" -name "${KERNEL_PKG}*.apk" -delete 2>/dev/null || true

          echo "=== Building kernel package (force) ==="
          # --lax: pmbootstrap borra y recrea chroot_native y chroot_buildroot* en
          # cada "build" (strict por defecto), y el paso de "checksum" de arriba ya
          # dejo el buildroot con los makedepends instalados. Saltarnos el zap
          # ahorra ~3 min de reconstruccion y hace el build determinista.
          pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 -j 2 --details-to-stdout build --lax "$KERNEL_PKG" --force 2>&1

          echo "=== Newly built kernel packages ==="
          find "$PMB_WORK/packages" -name "${KERNEL_PKG}*.apk" 2>/dev/null

      - name: Install Phosh base system
        run: |
          set -euxo pipefail

          EXTRA="${{ github.event.inputs.extra_space }}"
          FDE="${{ github.event.inputs.fde }}"
          CROSS="${{ github.event.inputs.cross }}"

          PMB_FLAGS=(
            -c "$PMB_CONFIG"
            -p "$PMAPORTS_DIR"
            -w "$PMB_WORK"
            -E "$EXTRA"
            -t 3600
            -j 2
            --details-to-stdout
          )

          if [ "$CROSS" = "false" ]; then
            PMB_FLAGS+=(--no-cross)
          fi

          echo "=== Pre-build status ==="
          pmbootstrap "${PMB_FLAGS[@]}" status || true

          echo "=== Build chroot ==="
          pmbootstrap "${PMB_FLAGS[@]}" build_init || true

          echo "=== Verify losetup ==="
          pmbootstrap "${PMB_FLAGS[@]}" chroot -- apk add --upgrade losetup util-linux || true
          pmbootstrap "${PMB_FLAGS[@]}" chroot -- sh -c '/usr/sbin/losetup --json --list >/dev/null && echo "losetup OK" || echo "caveat"'

          echo "=== Check disk before swap ==="
          df -h
          echo "=== Create swap (soft-fail) ==="
          FREE_GB=$(df --output=avail / | tail -1 | awk '{print int($1/1024/1024)}')
          if [ "$FREE_GB" -ge 6 ]; then
            sudo fallocate -l 2G /swapfile 2>/dev/null && echo "fallocate OK" || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null && echo "dd OK" || true
            sudo chmod 600 /swapfile 2>/dev/null || true
            sudo mkswap /swapfile 2>/dev/null || true
            sudo swapon /swapfile 2>/dev/null || true
            free -h
            echo "=== Swap created ==="
          else
            echo "Only ${FREE_GB}GB free, skipping swap"
          fi

          echo "=== Start pmbootstrap install (Phosh) ==="
          if [ "$FDE" = "true" ]; then
            printf '147147\n147147\n' | pmbootstrap "${PMB_FLAGS[@]}" install --fde
          else
            printf '147147\n147147\n' | pmbootstrap "${PMB_FLAGS[@]}" install
          fi

      - name: Verify kernel modules in rootfs (ruta dongle + MTK opcional)
        env:
          MTK_GEN4M: ${{ inputs.mtk_gen4m }}
        run: |
          set -euo pipefail
          CROSS="${{ github.event.inputs.cross }}"
          FLAGS=(-c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout)
          if [ "$CROSS" = "false" ]; then
            FLAGS+=(--no-cross)
          fi

          # El workflow pasa "true"/"false" (input choice), no 1/0. Ambas valen.
          MTK_GEN4M_ON=0
          case "${MTK_GEN4M:-0}" in
            1|true|TRUE|yes) MTK_GEN4M_ON=1 ;;
          esac

          echo "=== Modulos instalados en el rootfs (.ko o .ko.zst) ==="
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- sh -c \
            'find /usr/lib/modules -name "*.ko*" | sort' | tee /tmp/rootfs-mods.txt

          # --- Ruta por dongle (SIEMPRE): lo que tiene que funcionar por defecto ---
          # Ethernet USB: asix, ax88179_178a, r8150, r8152, cdc_ether, cdc_eem,
          #               cdc_ncm, dm9601, smsc95xx, sierra_net
          # Wi-Fi USB:    rtl8xxxu (Realtek), mt76_usb, mt76x0u, mt76x2u, mt7921u
          # BT USB:       btusb (CONFIG_BT_HCIBTUSB)
          # Serial USB:   pl2303, ftdi_sio, cp210x
          # Si falta alguno, el build se da por verde pero el dongle no funcionaria:
          # mejor fallar aqui que descubrirlo con el movil en la mano.
          missing=0
          for m in asix ax88179_178a r8150 r8152 cdc_ether cdc_eem cdc_ncm dm9601 \
                   smsc95xx sierra_net rtl8xxxu mt76_usb mt76x0u mt76x2u mt7921u \
                   btusb pl2303 ftdi_sio cp210x; do
            if grep -q "/${m}\.ko" /tmp/rootfs-mods.txt; then
              echo "OK dongle ${m}.ko"
            else
              echo "::error::el rootfs no trae ${m}.ko (ruta por dongle)"
              missing=1
            fi
          done

          # --- Stack MTK interno (opt-in con mtk_gen4m=true) ---
          # Los tres modulos del forward-port (drivers/misc/mediatek/{connectivity,btif}).
          if [ "$MTK_GEN4M_ON" != "1" ]; then
            echo "mtk_gen4m=false: no se exige el stack interno (wifi por dongle)"
          else
            for m in wmt_drv wlan_gen4m mtk-vendor-btif; do
              if grep -q "/${m}\.ko" /tmp/rootfs-mods.txt; then
                echo "OK mtk ${m}.ko"
              else
                echo "::error::el kernel no trae ${m}.ko (mtk_gen4m=true)"
                missing=1
              fi
            done
          fi
          exit "$missing"

      - name: Build & Add Plasma Mobile UI
        run: |
          set -euxo pipefail

          CROSS="${{ github.event.inputs.cross }}"
          FLAGS=(-c "$PMB_CONFIG" -p "$PMAPORTS_DIR" -w "$PMB_WORK" -t 3600 --details-to-stdout)
          if [ "$CROSS" = "false" ]; then
            FLAGS+=(--no-cross)
          fi

          echo "=== Searching for plasma-mobile in pmaports ==="
          find "$PMAPORTS_DIR" -type d -name "postmarketos-ui-plasma-mobile" 2>/dev/null | head -5
          find "$PMAPORTS_DIR" -type d -name "plasma-mobile" 2>/dev/null | head -5

          echo "=== Building plasma-mobile UI from pmaports (local compile) ==="
          # Soft-fail a proposito: si plasma-mobile no compila, queremos caer a
          # una imagen Phosh funcional en vez de perder el install y con ella la
          # imagen entera (este step usa set -e).
          pmbootstrap "${FLAGS[@]}" build postmarketos-ui-plasma-mobile 2>&1 \
            || echo "::warning::postmarketos-ui-plasma-mobile no compilo; continuando con Phosh"

          echo "=== Building tinydm (needed for multi-UI support) ==="
          pmbootstrap "${FLAGS[@]}" build tinydm 2>&1 || true

          echo "=== Installing plasma-mobile into device rootfs ==="
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- apk add --no-interactive postmarketos-ui-plasma-mobile 2>&1 \
            || echo "::warning::no se pudo instalar plasma-mobile; la imagen quedara con Phosh"

          echo "=== Verifying installed UIs in rootfs ==="
          pmbootstrap "${FLAGS[@]}" chroot --rootfs -- sh -c 'apk info 2>/dev/null | grep -iE "phosh|plasma|kwin|plasma" | sort' 2>&1

          echo "=== Rebuilding OS image with plasma-mobile added ==="
          pmbootstrap "${FLAGS[@]}" -E "${{ github.event.inputs.extra_space }}" -j 2 install --password 147147 2>&1

      - name: Export (primary)
        if: always()
        run: |
          mkdir -p artifacts/export
          pmbootstrap -c $PMB_CONFIG -p $PMAPORTS_DIR -w $PMB_WORK -t 3600 --details-to-stdout export || true
          cp -av /tmp/postmarketOS-export/* artifacts/export/ 2>/dev/null || true

      - name: Salvage images
        if: always()
        run: |
          set +e
          mkdir -p artifacts/salvage
          find "$PMB_WORK" -name "*.img" -exec cp -av {} artifacts/salvage/ \; 2>/dev/null
          find "$PMB_WORK" -name "boot.img" -exec cp -av {} artifacts/salvage/ \; 2>/dev/null
          find "$PMB_WORK" -name "initramfs*" -exec cp -av {} artifacts/salvage/ \; 2>/dev/null
          find "$PMB_WORK" -name "vmlinuz*" -exec cp -av {} artifacts/salvage/ \; 2>/dev/null
          find artifacts/salvage -type f -printf "%p %s bytes\n" | sort > artifacts/salvage/salvaged-files.txt 2>/dev/null
          set -e

      - name: Consolidate images
        if: always()
        run: |
          set +e
          mkdir -p artifacts/images
          cp -av artifacts/export/* artifacts/images/ 2>/dev/null
          cp -av artifacts/salvage/* artifacts/images/ 2>/dev/null
          find artifacts/images -type f -printf "%p %s bytes\n" | sort | tee artifacts/images/files.txt
          set -e

      - name: Validate
        if: always()
        run: |
          CNT=$(find artifacts -name "*.img" 2>/dev/null | wc -l)
          echo "image-files=$CNT"
          if [ "$CNT" -lt 1 ]; then
            echo "ERROR: No images found anywhere"
            find artifacts -type f -name "*.txt" -exec cat {} \; 2>/dev/null || true
            exit 1
          fi
          echo "SUCCESS: $CNT image file(s) found"
          find artifacts -type f -name "*.img" -o -name "boot*" -o -name "initramfs*" -o -name "vmlinuz*" 2>/dev/null | sort

      - name: Checksums
        if: always()
        run: |
          find artifacts -type f -not -name SHA256SUMS.txt -print0 | xargs -0 sha256sum > artifacts/SHA256SUMS.txt 2>/dev/null || true

      - name: Debug logs
        if: always()
        run: |
          mkdir -p artifacts/logs
          cp -av $PMB_CONFIG artifacts/logs/ 2>/dev/null || true
          cp -av $PMB_WORK/log.txt artifacts/logs/pmbootstrap-log.txt 2>/dev/null || true
          pmbootstrap -c $PMB_CONFIG -p $PMAPORTS_DIR -w $PMB_WORK status > artifacts/logs/pmbootstrap-status.txt 2>&1 || true
          df -h > artifacts/logs/df-h.txt 2>&1 || true

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmos-begonia-wifi-6.16.4-cross-${{ github.event.inputs.cross }}
          path: artifacts/
          retention-days: 14